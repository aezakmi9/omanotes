<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ANUS Widget</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>
    <main class="widget">
        <header class="header pywebview-drag-region">
            <h2>put your shit here...</h2>
            <div class="header-right">
                <span class="count" id="noteCount"></span>
                <button class="link" id="clearDone" hidden>clear done</button>
                <button class="close" id="closeBtn" title="Close">&times;</button>
            </div>
        </header>

        <div class="notes" id="notesContainer">
            <!-- Notes will be rendered here -->
        </div>

        <div class="box">
            <textarea id="i" rows="2" placeholder="Write a note…  (Enter to add, Shift+Enter for new line)"></textarea>
            <button id="addNote">add</button>
        </div>
    </main>
</body>
</html>
