
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Focus Widget</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>
    <main class="widget">
        <h2>Focus Tracker</h2>
        <p>Completed sessions</p>

        <div class="counter">
            <span id="count">0</span> / 8
        </div>

        <div class="progress">
            <div id="bar"></div>
        </div>

        <div class="actions">
            <button id="add">+1 Session</button>
            <button id="reset">Reset</button>
        </div>
    </main>
</body>
</html>
