<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ANUS Widget</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>
    <main class="widget">
        <header class="header">
            <h2>put your shit here...</h2>
            <span class="count" id="noteCount"></span>
        </header>

        <div class="notes" id="notesContainer">
            <!-- Notes will be rendered here -->
        </div>

        <div class="box">
            <textarea id="i" rows="2" placeholder="Write a note…  (Ctrl+Enter to add)"></textarea>
            <button id="addNote">add</button>
        </div>
    </main>
</body>
</html>
